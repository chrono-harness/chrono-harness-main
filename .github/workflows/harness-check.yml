name: Harness check
on:
  push:
    branches: ["dev", main]
  pull_request:
    branches: ["dev", main]
permissions:
  contents: read
jobs:
  check:
    runs-on: "ubuntu-24.04"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78
        with:
          version: 2026.11.12
          cache: false
          install: false
      - run: sh .chrono-harness/install-tools.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mise run harness-check
